<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF2D20"/>
      <stop offset="1" stop-color="#B91C10"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1280" height="440" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Fond clair -->
    <rect width="1280" height="440" fill="#FDFDFC"/>
    <circle cx="1210" cy="40" r="120" fill="#FFE9E7"/>
    <circle cx="1150" cy="430" r="70" fill="#FFF1F0"/>

    <!-- Panneau rouge Laravel en biais -->
    <path d="M0 0 H470 L380 440 H0 Z" fill="url(#panel)"/>

    <!-- Bouclier -->
    <path d="M205 92 L305 130 V218 C305 282 262 330 205 352 C148 330 105 282 105 218 V130 Z"
          fill="#FDFDFC" stroke="#FFB4AE" stroke-width="6" stroke-linejoin="round"/>
    <!-- Serrure -->
    <circle cx="205" cy="205" r="26" fill="#FF2D20"/>
    <path d="M193 222 H217 L226 282 H184 Z" fill="#FF2D20"/>
    <!-- Points décoratifs -->
    <g fill="#FF8A82">
      <circle cx="60" cy="60" r="5"/><circle cx="84" cy="60" r="5"/><circle cx="108" cy="60" r="5"/>
      <circle cx="60" cy="84" r="5"/><circle cx="84" cy="84" r="5"/>
      <circle cx="60" cy="108" r="5"/>
    </g>
  </g>

  <!-- Texte -->
  <text x="520" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#FF2D20" letter-spacing="6">LARAVEL</text>
  <text x="516" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1B1B18">Keycloak Sanctum</text>
  <text x="520" y="272" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#706F6C">Single sign-on for a front-end with a Laravel API</text>

  <!-- Etiquettes -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="520" y="316" width="150" height="44" rx="22" fill="#FFE9E7"/>
    <text x="595" y="345" fill="#B91C10">SSO login</text>
    <rect x="684" y="316" width="100" height="44" rx="22" fill="#FFE9E7"/>
    <text x="734" y="345" fill="#B91C10">Roles</text>
    <rect x="798" y="316" width="190" height="44" rx="22" fill="#FFE9E7"/>
    <text x="893" y="345" fill="#B91C10">Remote logout</text>
    <rect x="1002" y="316" width="170" height="44" rx="22" fill="#FFE9E7"/>
    <text x="1087" y="345" fill="#B91C10">Idle timeout</text>
  </g>
</svg>
